receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  # Spring AI / Micrometer emit gen_ai.usage.*_tokens as STRING attributes (Micrometer
  # KeyValues are string-only). Langfuse 3.33's ingestion schema requires usageDetails to be
  # numbers and silently rejects the generation event for string usage — so LLM "chat {model}"
  # spans never become GENERATION observations and token usage shows 0. Cast the three token
  # counts to int so Langfuse stores the generations with input/output/total usage.
  transform/langfuse_usage:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["gen_ai.usage.input_tokens"], Int(attributes["gen_ai.usage.input_tokens"])) where attributes["gen_ai.usage.input_tokens"] != nil
          - set(attributes["gen_ai.usage.output_tokens"], Int(attributes["gen_ai.usage.output_tokens"])) where attributes["gen_ai.usage.output_tokens"] != nil
          - set(attributes["gen_ai.usage.total_tokens"], Int(attributes["gen_ai.usage.total_tokens"])) where attributes["gen_ai.usage.total_tokens"] != nil

exporters:
  # Langfuse receives traces via OTLP HTTP
  otlphttp/langfuse:
    endpoint: http://langfuse:3000/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTEL_BASIC_AUTH:-bGYtcHViLWRldjpsZi1zZWMtZGV2}"
  # Iter 6 (NFR-O-001): mirror every trace to disk so a local run leaves an inspectable
  # JSONL artifact under ops/traces/ even when Langfuse is unhealthy. Rotation keeps the
  # file bounded for long-running demo sessions.
  file:
    path: /etc/otelcol/traces/cases.jsonl
    rotation:
      max_megabytes: 10
      max_days: 7
      max_backups: 3
  # Prometheus exporter for own metrics
  prometheus:
    endpoint: "0.0.0.0:9464"
  # Debug to stdout (helpful during development)
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      # transform/langfuse_usage runs before batch so the int-cast usage reaches every exporter
      # (Langfuse needs numeric usage; numeric is equally valid for the file/debug sinks).
      processors: [memory_limiter, transform/langfuse_usage, batch]
      exporters: [otlphttp/langfuse, file, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
  extensions: [health_check]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
