global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: orchestrator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["orchestrator:8081"]

  - job_name: sanctions-mcp
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["sanctions-mcp:8090"]

  - job_name: mock-psp
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["mock-psp:8091"]
