name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Build (no tests)
        run: ./gradlew build -x test

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Unit and integration tests
        run: ./gradlew test
      - name: Verify no unstable dependencies
        run: |
          result=$(./gradlew dependencies | grep -E "M[0-9]+$|RC|SNAPSHOT" || true)
          if [ -n "$result" ]; then
            echo "Unstable dependencies found:" && echo "$result" && exit 1
          fi

  eval:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Evals
        run: echo "Evals not implemented yet — available in Iteration 6"
