spring:
  application:
    name: orchestrator

  ai:
    # FR-A-COMMON: Anthropic provider for the three specialist agents (Iter 4b.1).
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    # FR-A-C-002: MCP client wires the sanctions tool consumed by ComplianceAgent.
    # NFR-S-007: allowlist by URL; the only configured server here is the local sanctions-mcp.
    mcp:
      client:
        streamable-http:
          connections:
            sanctions:
              url: ${SANCTIONS_MCP_URL:http://sanctions-mcp:8090}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:agentpay}
    username: ${POSTGRES_USER:agentpay}
    password: ${POSTGRES_PASSWORD:agentpay}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway owns schema (V1__init.sql)
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      # NFR-R-003: transactional producer. Used by OutboxPublisher to drain event_outbox
      # rows; rows that fail to publish stay unmarked and the next poll retries.
      transaction-id-prefix: orchestrator-tx-
      acks: all
      # Values are Avro-encoded PaymentEvent bytes (KafkaTemplate<String, byte[]>).
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

agentpay:
  # FR-A-COMMON-003: per-agent model selection. Sonnet 4.6 for reasoning, Haiku 4.5 for routing.
  # ADR-007: no Opus.
  models:
    risk: claude-sonnet-4-6
    compliance: claude-sonnet-4-6
    routing: claude-haiku-4-5
  # NFR-COST-002: per-model token rates ($/MTok). Cost per case is computed by ModelRates.
  rates:
    claude-sonnet-4-6:
      input-per-mtok: 3.00
      output-per-mtok: 15.00
    claude-haiku-4-5:
      input-per-mtok: 1.00
      output-per-mtok: 5.00
  mock-psp:
    url: ${MOCK_PSP_URL:http://mock-psp:8091}
  saga:
    # NFR-R-002: SagaRecoveryRunner picks up non-terminal cases on startup. This bound is
    # how long the Scenario G test waits for recovery to converge.
    recovery-timeout-seconds: 10
  outbox:
    # See OutboxPublisher TODO for tuning context (Iter 6, observability).
    poll-interval-ms: 200
  events:
    topic: payment.events

logging:
  level:
    com.agentpay.orchestrator: INFO
    org.flywaydb: INFO
