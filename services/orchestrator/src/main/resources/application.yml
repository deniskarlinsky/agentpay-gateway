spring:
  application:
    name: orchestrator

  ai:
    # FR-A-COMMON: Anthropic provider for the three specialist agents (Iter 4b.1).
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      # Empty unless overridden — tests point this at WireMock via @DynamicPropertySource.
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    # FR-A-C-002: MCP client wires the sanctions tool consumed by ComplianceAgent.
    # NFR-S-007: allowlist by URL; the only configured server here is the local sanctions-mcp.
    # initialized=false defers client.initialize() (and the streamable-http handshake) until
    # the first tool call. Combined with docker-compose's depends_on:sanctions-mcp:service_healthy
    # this gives two layers of protection against the orchestrator failing to start when the
    # sanctions-mcp container is still warming up.
    mcp:
      client:
        initialized: false
        streamable-http:
          connections:
            sanctions:
              url: ${SANCTIONS_MCP_URL:http://sanctions-mcp:8090}
    # FR-A-RT-002: pgvector store autoconfig owns route_metrics directly. Flyway owns DDL
    # (V2__route_metrics_voyage_dims.sql); initialize-schema=false prevents the store from
    # re-creating the table. dimensions=512 matches voyage-3-lite output; HNSW + cosine
    # matches the index in V2.
    vectorstore:
      pgvector:
        initialize-schema: false
        schema-name: public
        table-name: route_metrics
        dimensions: 512
        distance-type: COSINE_DISTANCE
        index-type: HNSW

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:agentpay}
    username: ${POSTGRES_USER:agentpay}
    password: ${POSTGRES_PASSWORD:agentpay}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway owns schema (V1__init.sql)
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      # NFR-R-003: transactional producer. Used by OutboxPublisher to drain event_outbox
      # rows; rows that fail to publish stay unmarked and the next poll retries.
      transaction-id-prefix: orchestrator-tx-
      acks: all
      # Values are Avro-encoded PaymentEvent bytes (KafkaTemplate<String, byte[]>).
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  # Iter 6 (NFR-O-001/002, FR-DP-004): full sampling for the MVP; Spring AI 1.1 emits chat-model
  # observations on the same registry, so configuring tracing here also routes GenAI spans through
  # OTLP without any manual instrumentation.
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}

agentpay:
  # Hand-rolled Voyage AI embedding client (Spring AI 1.1.5 ships no Voyage starter, see
  # VoyageEmbeddingModel javadoc). voyage-3-lite is 512-dim by default; the dimensions on
  # spring.ai.vectorstore.pgvector and V2__route_metrics_voyage_dims.sql must match.
  voyage:
    api-key: ${VOYAGE_API_KEY:}
    base-url: ${VOYAGE_BASE_URL:https://api.voyageai.com}
    model: voyage-3-lite
    dimensions: 512
  # FR-A-COMMON-003: per-agent model selection. Sonnet 4.6 for reasoning, Haiku 4.5 for routing.
  # ADR-007: no Opus.
  models:
    risk: claude-sonnet-4-6
    compliance: claude-sonnet-4-6
    routing: claude-haiku-4-5
  # NFR-COST-002: per-model token rates ($/MTok). Cost per case is computed by ModelRates.
  rates:
    claude-sonnet-4-6:
      input-per-mtok: 3.00
      output-per-mtok: 15.00
    claude-haiku-4-5:
      input-per-mtok: 1.00
      output-per-mtok: 5.00
  # NFR-COST-001 (Iter 6, Scenario F): per-case cost circuit breaker. Once the running sum of
  # agent_verdicts.cost_usd breaches this budget, the Supervisor cancels the remaining specialists
  # and the case is short-circuited to SUSPENDED_FOR_REVIEW + case.budget_exceeded.
  budget:
    per_case_usd: 0.10
  mock-psp:
    url: ${MOCK_PSP_URL:http://mock-psp:8091}
  saga:
    # NFR-R-002: SagaRecoveryRunner picks up non-terminal cases on startup. This bound is
    # how long the Scenario G test waits for recovery to converge.
    recovery-timeout-seconds: 10
  outbox:
    # See OutboxPublisher TODO for tuning context (Iter 6, observability).
    poll-interval-ms: 200
  case:
    # Iter 5 (FR-B-003, §7.1.3): trace URL surfaced by GET /internal/cases/{id}. Gateway proxies
    # this verbatim. Substituted token: {case_id}.
    trace-url-template: ${LANGFUSE_TRACE_URL_TEMPLATE:http://localhost:3000/trace/{case_id}}
  events:
    topic: payment.events
    # FR-O-005 (Scenario C): topics for human review escalation. Broker auto.create.topics.enable
    # is on in docker-compose and Testcontainers KafkaContainer, so we don't pre-declare beans.
    human-approval-requests-topic: human.approval.requests
    human-approval-responses-topic: human.approval.responses
    human-approval-responses-group-id: orchestrator-human-approvals
    # NFR-COST-001 (Iter 6, Scenario F): published when the Supervisor short-circuits a case
    # because the per-case budget was exceeded. Distinct topic so observability consumers can
    # alert on it without subscribing to the on-call CLI's human-approval feed.
    case-budget-exceeded-topic: case.budget_exceeded

logging:
  level:
    com.agentpay.orchestrator: INFO
    org.flywaydb: INFO
