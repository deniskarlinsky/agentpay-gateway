spring:
  application:
    name: mock-psp

server:
  port: 8091

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  # Iter 6 (NFR-O-001): POST /charge spans participate in the case trace.
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}

logging:
  structured:
    format:
      console: ecs
  include-application-name: true

mock-psp:
  profiles:
    psp-a:
      success-rate: 0.95
      cost-bps: 30
    psp-b:
      success-rate: 0.88
      cost-bps: 20
    psp-c:
      success-rate: 0.98
      cost-bps: 45
