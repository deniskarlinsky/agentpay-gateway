spring:
  application:
    name: mock-psp

server:
  port: 8091

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

mock-psp:
  profiles:
    psp-a:
      success-rate: 0.95
      cost-bps: 30
    psp-b:
      success-rate: 0.88
      cost-bps: 20
    psp-c:
      success-rate: 0.98
      cost-bps: 45
