spring:
  application:
    name: sanctions-mcp
  ai:
    mcp:
      server:
        name: sanctions-mcp
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  # Iter 6 (NFR-M-006): inbound MCP tool invocations become child spans of the orchestrator's
  # case span — W3C trace context propagates via the streamable-http transport.
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
