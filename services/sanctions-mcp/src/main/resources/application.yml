spring:
  application:
    name: sanctions-mcp
  ai:
    mcp:
      server:
        name: sanctions-mcp
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
