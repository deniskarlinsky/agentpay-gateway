spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  # Iter 6 (NFR-O-001): sample every trace in the MVP — volume is tiny. OTLP_ENDPOINT defaults
  # to the docker-compose service name; tests/local runs override via env var or fall through to
  # the no-op when otel-collector isn't reachable (Spring Boot logs one warning and continues).
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}

agentpay:
  gateway:
    issuer: agentpay-gateway
    signing-key-pem: ${GATEWAY_SIGNING_KEY_PEM:}
    signing-key-path: .local/gateway-key.pem
    max-ttl-seconds: 300
    trace-url-template: "http://localhost:3000/trace/{case_id}"
  orchestrator:
    url: ${ORCHESTRATOR_URL:http://orchestrator:8081}
  rate-limit:
    requests-per-minute-per-agent: 60
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3002

logging:
  structured:
    format:
      console: ecs
  include-application-name: true
  level:
    com.agentpay.gateway: INFO
